<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Primary Accent Gradient (Cyan to Indigo) -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Secondary Accent Gradient (Violet to Cyan) -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Backdrop -->
  <rect x="10" y="10" width="280" height="280" rx="64" ry="64" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Ambient Glow Behind Central Emblem -->
  <circle cx="150" cy="150" r="70" fill="url(#cyanIndigo)" opacity="0.25" filter="url(#softGlow)" />

  <!-- Outer Dimension / Viewport Crop Frame (Dashed Scaling Frame) -->
  <rect x="54" y="54" width="192" height="192" rx="28" ry="28" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7" />

  <!-- Corner Alignment Nodes (Viewport Crop Brackets) -->
  <path d="M 54 84 L 54 66 A 12 12 0 0 1 66 54 L 84 54" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <path d="M 246 84 L 246 66 A 12 12 0 0 0 234 54 L 216 54" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <path d="M 54 216 L 54 234 A 12 12 0 0 0 66 246 L 84 246" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
  <path d="M 246 216 L 246 234 A 12 12 0 0 1 234 246 L 216 246" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

  <!-- Inner Scaled Asset Frame (Solid Glowing Cyan/Indigo) -->
  <rect x="80" y="80" width="140" height="140" rx="20" ry="20" fill="#0f172a" stroke="url(#cyanIndigo)" stroke-width="3" filter="url(#glow)" />

  <!-- Mountain Peak / Waveform Image Vector Element -->
  <path d="M 94 186 L 126 136 L 152 168 L 176 128 L 206 186 Z" fill="url(#cyanIndigo)" opacity="0.85" />

  <!-- High-Tech Sun / Pixel Particle -->
  <circle cx="120" cy="116" r="12" fill="#38bdf8" />

  <!-- Dynamic Scaling Expansion Arrows (Vector Arrows) -->
  <path d="M 198 102 L 218 82 M 218 82 L 202 82 M 218 82 L 218 98" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 102 198 L 82 218 M 82 218 L 98 218 M 82 218 L 82 202" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Interactive Vector Anchor Nodes -->
  <circle cx="82" cy="82" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="218" cy="82" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="82" cy="218" r="5" fill="#818cf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="218" cy="218" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />
</svg>
